<div class="modal fade" id="galerieModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark position-relative">
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Zavřít"></button>
      <button type="button" class="arrow arrow-left" id="arrow-left" aria-label="Předchozí">&#10094;</button>
      <button type="button" class="arrow arrow-right" id="arrow-right" aria-label="Další">&#10095;</button>

<script src="js/bootstrap.bundle.min.js"></script>
<script>
  (function() {
    // Dynamicky načteme všechny obrázky z HTML, které mají třídu .gallery-img
    const galleryItems = document.querySelectorAll('.gallery-img');
    const images = Array.from(galleryItems).map(img => img.src);
    
    let currentIndex = 0;

    const modalEl = document.getElementById('galerieModal');
    const modalImage = document.getElementById('modal-image');
    const dotsContainer = document.getElementById('dots-container');
    const arrowLeft = document.getElementById('arrow-left');
    const arrowRight = document.getElementById('arrow-right');

    function createDots() {
      dotsContainer.innerHTML = "";
      images.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          showImage(i);
        });
        dotsContainer.appendChild(dot);
      });
    }

    function updateControls() {
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, i) => {
        d.classList.toggle('active', i === currentIndex);
      });

      arrowLeft.classList.toggle('disabled', currentIndex === 0);
      arrowRight.classList.toggle('disabled', currentIndex === images.length - 1);
    }

    function showImage(index) {
      if (index < 0 || index >= images.length) return;
      currentIndex = index;

      modalImage.classList.add('fading');

      setTimeout(() => {
        modalImage.src = images[currentIndex];
        modalImage.classList.remove('fading');
        updateControls();
      }, 200);
    }

    // Eventy pro šipky
    arrowLeft.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentIndex > 0) showImage(currentIndex - 1);
    });

    arrowRight.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentIndex < images.length - 1) showImage(currentIndex + 1);
    });

    // Eventy pro kliknutí na náhledy v galerii
    galleryItems.forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-index'), 10);
        currentIndex = idx;
        modalImage.src = images[currentIndex];
        // Při otevření modálu inicializujeme tečky a šipky
        if (!dotsContainer.hasChildNodes()) createDots();
        updateControls();
      });
    });

    // Klávesové zkratky
    document.addEventListener('keydown', (e) => {
      if (!modalEl.classList.contains('show')) return;
      if (e.key === 'ArrowLeft' && currentIndex > 0) showImage(currentIndex - 1);
      if (e.key === 'ArrowRight' && currentIndex < images.length - 1) showImage(currentIndex + 1);
    });

    // Inicializace teček při prvním otevření
    modalEl.addEventListener('shown.bs.modal', () => {
      if (!dotsContainer.hasChildNodes()) createDots();
      updateControls();
    });
  })();
</script>
